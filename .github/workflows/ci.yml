name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # cryptography (Ed25519, used by src/apertoid/sig.py) is a declared
      # runtime dependency in pyproject.toml, so it installs transitively.
      - name: Install
        run: pip install -e ".[test]"
      - name: Run the full test suite
        run: python -m pytest tests/ -q

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Reference implementation must agree with the published drafts
        # apertoid's analogue of apertomemory's "vectors must be reproducible":
        # the -sig conformance harness parses the published draft's own example
        # (pk/body_hash/sig) straight out of spec/ and cryptographically
        # verifies the Ed25519 signature against sig.py. A reference impl that
        # cannot verify the signature printed in the draft is not a reference.
        run: python -m pytest tests/test_sig_draft_conformance.py -q
