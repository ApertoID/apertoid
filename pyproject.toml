[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apertoid"
version = "0.2.0"
description = "ApertoID reference implementation: DNS record parsing, HTTP request signing, and end-to-end agent verification for draft-ferro-dnsop-apertoid and draft-ferro-httpbis-apertoid-sig"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Andrea Ferro", email = "irn@irn3.com" }]
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/ApertoID/apertoid"
Repository = "https://github.com/ApertoID/apertoid"

[project.optional-dependencies]
test = ["pytest>=7"]
dns = ["dnspython>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
